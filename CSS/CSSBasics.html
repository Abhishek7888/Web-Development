<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Basics</title>
    <style>
        h1 {
            color: red;
        }
        p {
            font-size: 18px;
            color: blue;
        }
        button {
            background-color: green;
            color: white;
        }
    </style>
</head>
<body>
    <!-- ?Inline styles -->
    <h1 style="color: red;">CSS Basics</h1>
    <p style="font-size: 18px; color: blue;">This is a simple paragraph to demonstrate CSS styling.</p>
    <button style="background-color: green; color: white;">Click Me</button>

    <!-- Style -->
     <h1>CSS Basics</h1>
    <p>This is a simple paragraph to demonstrate CSS styling.</p>
    <button>Click Me</button>
</body>
</html>
